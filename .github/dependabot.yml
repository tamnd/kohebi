version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR for routine patch bumps instead of twenty.
      patch-updates:
        update-types: [patch]
      cranelift:
        patterns: ["cranelift-*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        # The MSRV job pins dtolnay/rust-toolchain to the exact toolchain in
        # Cargo.toml and rust-toolchain.toml. That action pre-creates branches
        # for Rust versions that have not been released, so dependabot happily
        # proposes 1.100.0 while stable is 1.98.0 and the job then fails on a
        # toolchain rustup cannot fetch. Bumping the MSRV is a deliberate
        # decision made in three files at once, not a dependency update.
        exclude-patterns: ["dtolnay/rust-toolchain"]
    ignore:
      - dependency-name: dtolnay/rust-toolchain
