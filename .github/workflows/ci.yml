name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features

  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: taiki-e/install-action@v2.87.0
        with:
          tool: cargo-nextest
      # --no-tests=warn because the crates are still skeletons and nextest
      # treats an empty run as an error, which is the right default and the
      # wrong one for today. It prints a warning on every run, which is the
      # point: this goes back to the default the moment M0 lands a test, and
      # until then the log says out loud that nothing was verified.
      - run: cargo nextest run --workspace --all-features --no-tests=warn
      # nextest does not run doctests; they still have to pass.
      - run: cargo test --workspace --doc

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      # Must match rust-version in Cargo.toml and rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo check --workspace --all-features

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo doc --workspace --no-deps --all-features

  # Packaging is checked on every change rather than at release time, because a
  # crate that cannot be packaged is found the moment the file that breaks it
  # lands and not an hour into a release that has already tagged and built.
  package:
    name: Package for crates.io
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo publish --workspace --locked --dry-run

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: taiki-e/install-action@v2.87.0
        with:
          tool: cargo-deny
      - run: cargo deny check

  # The unsafe in kohebi-core is load-bearing, so the count is tracked rather
  # than gated. A jump in this number should be a conscious decision.
  unsafe-audit:
    name: Unsafe audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2.87.0
        with:
          tool: cargo-geiger
      - run: cargo geiger --workspace --output-format GitHubMarkdown >> "$GITHUB_STEP_SUMMARY" || true

  # Every job above must pass. Branch protection targets this one job so that
  # adding a matrix entry does not require touching repository settings.
  ci-ok:
    name: CI
    if: always()
    needs: [lint, test, msrv, docs, deny, package]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required checks passed."
