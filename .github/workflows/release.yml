name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: read

# A dispatch has no tag in `github.ref_name`, so the tag to build is named once
# here and everything else reads it from here.
env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-26
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Asking twice, because the runners ship a rustup that reports success on
      # `toolchain install --target` and leaves the standard library for a
      # target it is not hosting behind. `rustup target add` is idempotent, and
      # when it does fail it fails here rather than as `can't find crate for
      # core` several minutes into a build.
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo build --release --bin kohebi --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="kohebi-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/kohebi.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/kohebi" "dist/$name/"
          fi
          cp README.md LICENSE-APACHE LICENSE-MIT "dist/$name/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist-${{ matrix.target }}
          # One pattern per line. The upload action's globs are not a shell's,
          # so `dist/*.{tar.gz,zip}` matches a file with a literal brace in its
          # name and nothing else, which is how 0.0.4 built six binaries and
          # published none of them.
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  crates:
    name: crates.io
    # After the binaries, so a version that does not build on all six targets
    # never reaches a registry nothing can be deleted from. A GitHub release can
    # be pulled down and a crates.io version cannot, only yanked, so this is the
    # step that has to be sure.
    needs: publish
    runs-on: ubuntu-24.04
    # The first release publishes fourteen crates that do not exist yet, and
    # crates.io holds five of those in an account's bucket and refills one every
    # ten minutes. So the first run of this job is a long sleep, a little over
    # two hours if the bucket starts empty, and every run after it takes a couple
    # of minutes, because a new version of a crate that exists is a different and
    # much larger allowance. The script is safe to run again, so a job that runs
    # out of time here is re-run rather than restarted.
    timeout-minutes: 350
    # An environment rather than a repository secret, so the token is reachable
    # only from a job that names this environment, and only from a `v*.*.*` tag,
    # which is the deployment branch policy set on it. A branch cannot get at it.
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - name: The tag and the manifests agree
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version 1 --no-deps |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "v${version}" != "${TAG}" ]; then
            echo "tag ${TAG} against workspace version ${version}" >&2
            exit 1
          fi
      # Packaged and built from the package, so a crate that only compiles
      # because of a file the package does not carry fails here rather than
      # after the upload, which cannot be taken back.
      - run: cargo publish --workspace --locked --dry-run
      - run: ./scripts/publish-crates.sh
        env:
          # TODO: swap this for `rust-lang/crates-io-auth-action`, which mints a
          # short lived token from the job's OIDC identity and needs no secret
          # at all. It cannot be set up yet, because a trusted publisher is
          # configured per crate on a crate that already exists, and none of
          # these do. This is the release that makes them exist.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
