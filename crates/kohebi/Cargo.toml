[package]
name = "kohebi"
description = "A Python runtime written in Rust, with a tiered JIT and an ahead-of-time compiler that emits Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["python", "runtime", "jit", "interpreter", "compiler"]
